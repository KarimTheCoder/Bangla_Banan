# ------------ Gradle Performance -------------
org.gradle.jvmargs=-Xmx4096m -Xms1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
# Enable configuration caching for faster builds
org.gradle.unsafe.configuration-cache=true
# Adjust the number of concurrent workers
org.gradle.workers.max=8

# ------------ Kotlin Performance -------------
kotlin.incremental=true
kotlin.daemon.jvm.options=-Xmx3072m
kotlin.compiler.execution.strategy=in-process

# ------------ KAPT / KSP (if used) -------------
kapt.incremental.apt=true
kapt.use.worker.api=true

# ------------ Android Specifics -------------
android.useAndroidX=true
